workflows:
  flutter-workflow:
    name: Build Android APK
    environment:
      flutter: stable
    scripts:
      - name: Create Android structure if missing
        script: flutter create . --platforms=android --org com.territorio.vitoria
      - name: Get dependencies
        script: flutter packages get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

